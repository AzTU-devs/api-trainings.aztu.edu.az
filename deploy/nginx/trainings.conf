# Host reverse proxy for the AzTU trainings platform.
# Installed as /etc/nginx/sites-available/trainings (docs/operations/deployment.md §6).
#
# This file is the only TLS terminator in front of all three services, and it is
# the source of truth for that vhost. Nothing updates /etc/nginx by itself, and
# `git pull` never has: the live copy drifted behind the runbook once already (no
# /ws upgrade, /actuator open, 1 MB bodies). After every pull, compare:
#
#   diff -u /opt/trainings/api-trainings.aztu.edu.az/deploy/nginx/trainings.conf \
#           /etc/nginx/sites-available/trainings
#
# Ubuntu's nginx.conf includes sites-enabled/* inside `http {}`, so anything at the
# top level of this file is an http-level directive for the whole host.
#
# Certificates: one certificate for the three names, named trainings.aztu.edu.az,
# obtained with `certbot certonly` BEFORE this file is enabled (§6). `nginx -t`
# fails if a certificate file below does not exist yet, which is why §6 gets the
# certificate first and enables this file second. If the host's certificate has a
# different name (`sudo certbot certificates`), change the six ssl_certificate*
# paths below and nothing else.

# WebSocket upgrade, switched per request. Only a WebSocket handshake carries an
# Upgrade header; for everything else this is `close`, the value nginx would send
# anyway, so ordinary requests are unaffected. Named with a trainings_ prefix
# because two `map`s defining the same variable anywhere on the host fail `nginx -t`,
# and $connection_upgrade is the name every other tutorial uses.
map $http_upgrade $trainings_connection_upgrade {
    default upgrade;
    ''      close;
}

# The forwarded headers the services depend on, set at http level, so they apply
# to every location that sets no proxy_set_header of its own. A location that sets
# ANY proxy_set_header inherits none of these, which is why the locations below
# that add Upgrade/Connection repeat all four.
#
# X-Real-IP is $remote_addr, which a client cannot forge. The public site's BFF
# prefers it for that reason: without it every visitor's auth calls share one
# rate-limit bucket, and the 11th login site-wide in a minute returns 429.
#
# $proxy_add_x_forwarded_for appends $remote_addr to whatever X-Forwarded-For the
# client sent, and that is safe for the API: Tomcat's RemoteIpValve
# (server.forward-headers-strategy=native) reads the list right to left, skips
# only trusted internal proxies and stops at the first address that is not one,
# which is the $remote_addr appended here. A prepended, forged entry is never
# reached. The API ignores X-Real-IP and Forwarded.
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

# ── Plain HTTP: redirect to HTTPS ─────────────────────────────────────────────
# certbot renews over this port. Its nginx plugin adds an exact-match
# `location = /.well-known/acme-challenge/<token>` for the length of the
# challenge, which wins over `location /`, so the redirect never gets in its way.
server {
    listen 80;
    listen [::]:80;
    server_name trainings.aztu.edu.az dashboard-trainings.aztu.edu.az api-trainings.aztu.edu.az;
    server_tokens off;

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── Public site ───────────────────────────────────────────────────────────────
# `http2` on the listen line switches it on for every server on 443, since nginx
# negotiates it per address:port. The public site loads about 30 resources per page,
# which HTTP/1.1 fetches six at a time. nginx 1.18 keeps HTTP/2 Rapid Reset
# (CVE-2023-44487) in check through its defaults, keepalive_requests 1000 and
# http2_max_concurrent_streams 128; do not raise either. The IPv6 lines assume the
# host has IPv6, as Ubuntu's own default site does; drop them if `nginx -t` reports
# "Address family not supported".
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name trainings.aztu.edu.az;

    ssl_certificate     /etc/letsencrypt/live/trainings.aztu.edu.az/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/trainings.aztu.edu.az/privkey.pem;

    # No version or OS in the Server header and on nginx's own error pages. Also set
    # in nginx.conf for the rest of the host (§6); repeated here so this file is
    # right on its own.
    server_tokens off;

    location / {
        proxy_pass http://127.0.0.1:3000;
    }
}

# ── Admin portal ──────────────────────────────────────────────────────────────
# The portal is built with VITE_API_BASE_URL=/api, so every API call, every upload
# and the notification socket (wss://dashboard-trainings.aztu.edu.az/ws) come in
# HERE, go to the container's own nginx on 8081, and only then reach the API. The
# container allows 550m and passes the WebSocket upgrade, but this outer hop applies
# its own limits first. With nginx's defaults (1m bodies, HTTP/1.0 upstream, Upgrade
# and Connection stripped) every cover over 1 MB, every document and every lesson
# video got a bare 413 here, and the /ws handshake got a 400.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name dashboard-trainings.aztu.edu.az;

    ssl_certificate     /etc/letsencrypt/live/trainings.aztu.edu.az/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/trainings.aztu.edu.az/privkey.pem;

    server_tokens off;

    # The same ceiling as the container's /api/ location. Lesson video is ONE
    # `PUT /api/videos/{id}/content` of up to UPLOAD_MAX_VIDEO_MB (512), and this
    # must stay above that, or the uploader gets a bodyless 413 the portal cannot
    # explain. client_body_timeout is the gap allowed between reads, not a total, so
    # a slow link is fine as long as bytes keep arriving. With request buffering off
    # the body streams through instead of being spooled to disk first: nginx would
    # otherwise write 512 MB to /var/lib/nginx before the API could reject an
    # unauthenticated upload with a 401.
    client_max_body_size    550m;
    client_body_timeout     300s;
    proxy_request_buffering off;

    # HSTS for the portal itself. Until now only its /api/ responses carried one
    # (Spring's), so a visitor who never made an API call was never pinned to HTTPS.
    # includeSubDomains here covers only names under dashboard-trainings.aztu.edu.az,
    # never a sibling. The upstream copy is hidden so each response carries exactly
    # one.
    proxy_hide_header Strict-Transport-Security;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        proxy_pass http://127.0.0.1:8081;

        # HTTP/1.1 and the two upgrade headers are what a WebSocket handshake needs;
        # the map keeps them harmless for everything else.
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $trainings_connection_upgrade;
        # Setting the two above drops the inherited http-level set, so all four
        # are repeated. X-Forwarded-For is a single clean value: the container's
        # nginx trusts it from 127.0.0.1 (set_real_ip_from) and forwards only
        # that address to the API.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Above the container's own timeouts (600s for /api/, 3600s for /ws), so the
        # inner hop is the one that decides. A notification socket is idle between
        # 10s heartbeats; the 60s default would still work, but only just.
        proxy_read_timeout 3600s;
        proxy_send_timeout 600s;
    }
}

# ── API ───────────────────────────────────────────────────────────────────────
# Called directly by browsers on the public site (REST, uploads, media and the
# notification socket) and by the portal only when it is built with an absolute
# VITE_API_BASE_URL.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api-trainings.aztu.edu.az;

    ssl_certificate     /etc/letsencrypt/live/trainings.aztu.edu.az/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/trainings.aztu.edu.az/privkey.pem;

    server_tokens off;

    # 550m, matching the portal: video is a single PUT of up to UPLOAD_MAX_VIDEO_MB
    # (512). See the admin portal block above for the timeout and buffering reasons.
    # HTTP/1.1 upstream because with 1.0 nginx has to spool a chunked request body
    # whatever proxy_request_buffering says.
    client_max_body_size    550m;
    client_body_timeout     300s;
    proxy_request_buffering off;
    proxy_http_version      1.1;
    proxy_read_timeout      300s;
    proxy_send_timeout      600s;

    # Security headers for every response from this host. Spring already sends
    # nosniff, X-Frame-Options, HSTS and Cache-Control; these are the ones it does
    # not send. Media is served from this host, so an uploaded file opened directly
    # as a document had only nosniff and Content-Disposition between it and a
    # browser. The CSP drops such a document into an opaque origin with no scripts,
    # forms or network; allow-downloads keeps attachment downloads working. CSP on a
    # fetch/XHR, <img> or <video> response is ignored, so the sites' own use of the
    # API is unaffected. Setting SWAGGER_ENABLED=true would need a location of its
    # own without this CSP, because the Swagger UI is a document with scripts.
    #
    # CORP is same-site, not same-origin: trainings.aztu.edu.az and
    # dashboard-trainings.aztu.edu.az load images and video from this host, and they
    # are the same site (aztu.edu.az) but not the same origin.
    #
    # add_header does not merge across levels: a location with any add_header of its
    # own loses all of these. None of the locations below has one; keep it so.
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; sandbox allow-downloads" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Resource-Policy "same-site" always;

    location / {
        proxy_pass http://127.0.0.1:8080;
    }

    # Actuator is for this host only, so health and anything re-exposed later
    # (prometheus) stay off the internet whatever the app's exposure list says.
    # No trailing slash: the bare /actuator index is covered too, and ^~ stops a
    # regex location added later from taking these paths over. The container
    # HEALTHCHECK and the compose healthcheck call 127.0.0.1:8080 directly, not
    # through this vhost, so they are unaffected. An uptime monitor elsewhere needs
    # an `allow <its address>;` line above the deny.
    location ^~ /actuator {
        allow 127.0.0.1;
        deny  all;
        proxy_pass http://127.0.0.1:8080;
    }

    # STOMP notifications for the public site. The endpoint is exactly /ws, and
    # NEXT_PUBLIC_WS_URL in the public site's .env must match it. Without this block
    # the handshake reaches Spring without its Upgrade header and gets a 400
    # 'Can "Upgrade" only to "WebSocket"'.
    location /ws {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $trainings_connection_upgrade;
        # Repeated for the reason given at the top of the file.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }
}
