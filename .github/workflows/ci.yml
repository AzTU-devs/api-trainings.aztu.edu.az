name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build · Test · Package
    runs-on: ubuntu-latest

    # @SpringBootTest boots the real context, which means Flyway and a real
    # datasource — an in-memory database is not an option because the migrations
    # use Postgres-specific types (citext, inet, jsonb).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: eduplatform
          POSTGRES_USER: eduplatform
          POSTGRES_PASSWORD: eduplatform
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin
          cache: maven

      # Generated per run rather than committed: a literal would be a real signing
      # key in version control, and StartupSecurityValidator rejects every obvious
      # placeholder ("change-me", "dev-only", "insecure") outside the dev profile,
      # so a fake one would break the moment CI stops running the dev profile.
      - name: Generate CI-only JWT signing secret
        run: echo "JWT_ACCESS_SECRET=$(openssl rand -base64 48)" >> "$GITHUB_ENV"

      - name: Build & test
        env:
          # dev, so Flyway also applies classpath:db/dev — those seed migrations ship
          # in this repo and would otherwise never be exercised. The prod profile's own
          # guards are asserted at deploy time by StartupSecurityValidator.
          SPRING_PROFILES_ACTIVE: dev
          DATABASE_URL: jdbc:postgresql://localhost:5432/eduplatform
          DATABASE_USERNAME: eduplatform
          DATABASE_PASSWORD: eduplatform
          # Keep uploads inside the workspace: /opt/uploads (the production default)
          # is not writable by the runner user.
          STORAGE_LOCAL_DIR: ${{ github.workspace }}/var/uploads
        run: ./mvnw -B -ntp verify

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    needs: verify
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t eduplatform-backend:${{ github.sha }} .
