# Production stack for the backend ONLY.
#
# Unlike docker-compose.yml (the local dev stack) this does NOT start a Postgres
# container — it connects to PostgreSQL already installed on the host.
#
#   docker compose -f docker-compose.prod.yml up -d --build
#
# All configuration comes from .env in this directory. That file must exist and
# must contain DATABASE_URL / DATABASE_USERNAME / DATABASE_PASSWORD /
# JWT_ACCESS_SECRET, or the app refuses to start.
#
# The profile is the one exception: it is pinned to prod below, under
# `environment:`, and .env cannot change it. See the note there.
#
# .env is read when the container is CREATED, not when it starts. After editing
# it, run `up -d` (compose recreates the container because its config changed);
# `docker compose restart` keeps the old values.

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: eduplatform-backend:prod
    container_name: eduplatform-backend
    restart: unless-stopped

    # Host networking, for two reasons:
    #  1. The database is on the host. Inside a bridge network, 127.0.0.1 is the
    #     container itself, so DATABASE_URL would have to point at the docker
    #     gateway — which means opening Postgres beyond loopback and widening
    #     pg_hba.conf. Host networking lets 127.0.0.1:5432 mean what it says.
    #  2. Published ports (`ports:`) bypass UFW. Docker inserts its own rules
    #     ahead of the INPUT chain, so `ufw deny 8080` would NOT close a
    #     published port. With network_mode: host the app binds like any other
    #     host process and UFW governs it normally.
    #
    # Consequence: `ports:` is ignored here. The listen port is SERVER_PORT in .env.
    network_mode: host

    env_file:
      - .env

    # Pinned here because env_file beats the image: a SPRING_PROFILES_ACTIVE line in
    # .env overrides the Dockerfile's ENV SPRING_PROFILES_ACTIVE=prod. A .env copied
    # from .env.example used to carry `dev`, and under dev the app applies the
    # db/dev seed migrations (SUPER_ADMIN and ADMIN with the public password
    # Password123!), turns Swagger on, and StartupSecurityValidator skips every
    # check, including the one that rejects the placeholder JWT secret. Anyone could
    # then sign their own SUPER_ADMIN token. `environment:` beats env_file, so under
    # this file the profile is prod whatever .env says, and a placeholder secret
    # stops startup.
    environment:
      SPRING_PROFILES_ACTIVE: prod

    # Longer than the app's own drain. application-prod.properties gives in-flight
    # requests 25s (server.shutdown=graceful, timeout-per-shutdown-phase=25s), but
    # Docker's default stop timeout is 10s, after which it sends SIGKILL. Without
    # this line an `up -d --build` would cut uploads and refresh-token rotations off
    # at 10s. The extra 5s covers the JVM's own exit after the drain.
    stop_grace_period: 30s

    # The Dockerfile sizes the heap with -XX:MaxRAMPercentage=75, which is a share of
    # whatever memory the container can see. With no limit that is the whole host,
    # shared with Postgres and the two frontends, so the JVM could grow until the
    # kernel's OOM killer picked a victim, possibly Postgres. 2g gives a heap of
    # about 1.5 GiB and leaves 512 MiB for metaspace, threads and buffers. Do not go
    # down to 1g: resident memory is already about 730 MiB under light load.
    mem_limit: 2g

    volumes:
      # Same path on both sides, and identical to STORAGE_LOCAL_DIR in .env and to the
      # image's VOLUME. If the container path here and STORAGE_LOCAL_DIR ever diverge,
      # uploads land on the container's own layer and are destroyed by the next
      # redeploy — with no error at any point. Kept outside the repo so a fresh clone
      # or a rebuild cannot delete uploaded files.
      # The host directory must be owned by 1001:1001 (the image's app user), or every
      # write fails with EACCES:
      #   sudo mkdir -p /opt/uploads && sudo chown -R 1001:1001 /opt/uploads
      - /opt/uploads:/opt/uploads

    healthcheck:
      # Readiness, not the aggregate health: readiness is scoped to the database,
      # so an SMTP outage cannot mark a serving container unhealthy.
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider",
             "http://127.0.0.1:8080/actuator/health/readiness"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
