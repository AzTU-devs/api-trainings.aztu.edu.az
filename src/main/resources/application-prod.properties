# Production overrides. Active when SPRING_PROFILES_ACTIVE=prod (set by the Docker image).
#
# Everything here is a hardening delta over application.properties. Datasource and
# secrets are NOT defaulted anywhere — the container must inject DATABASE_URL,
# DATABASE_USERNAME, DATABASE_PASSWORD and JWT_ACCESS_SECRET or startup fails.

# ---------------------------------------------------------------------------
# Flyway — production schema only. db/dev (V6 seed users with the shared
# password Password123!, V7 seed tutor) must never run here.
# ---------------------------------------------------------------------------
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
# Fail rather than silently re-checksumming a tampered migration.
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true

# ---------------------------------------------------------------------------
# Error responses — no internals to unauthenticated callers.
# ---------------------------------------------------------------------------
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false

# Forwarded headers: nothing to set here. application.properties uses
# server.forward-headers-strategy=native, which trusts X-Forwarded-For / X-Forwarded-Proto only
# from loopback and private-range peers in every profile. The old TRUST_FORWARD_HEADERS switch is
# gone; a leftover line in .env is ignored.

# Admin self-registration: open only while this is true AND no ADMIN/SUPER_ADMIN exists.
app.security.admin-self-register-enabled=${ADMIN_SELF_REGISTER:false}

# ---------------------------------------------------------------------------
# API docs — off by default in prod; flip SWAGGER_ENABLED=true to expose them.
# ---------------------------------------------------------------------------
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}

# ---------------------------------------------------------------------------
# Actuator — health/info only, and health details never anonymous.
#
# /actuator/prometheus is deliberately absent: the metric set publishes a complete
# URI inventory plus JVM, pool and datasource internals, which is free
# reconnaissance for anyone who can reach the port. Dropping it from the exposure
# list is what closes it — the path itself is reachable without a token. See
# DEPLOY.md ("Metrics") before turning it back on; it then needs a firewall or
# authentication in front of it, not just re-listing here.
# ---------------------------------------------------------------------------
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true
management.info.env.enabled=false

# The mail health indicator is switched off in application.properties for every profile.
# Do not re-enable it here, even when MAIL_ENABLED=true: it logs in to SMTP on every anonymous
# /actuator/health call.

# Readiness = "can this instance serve requests", which means the database and
# nothing else. Third-party outages must not eject a working instance from the
# load balancer; they belong on dashboards, not in the probe.
management.endpoint.health.group.readiness.include=readinessState,db
management.endpoint.health.group.liveness.include=livenessState

# ---------------------------------------------------------------------------
# Logging — INFO app, no SQL. LOG_LEVEL_* still override per-deployment.
# ---------------------------------------------------------------------------
logging.level.root=INFO
logging.level.com.eduplatform=${LOG_LEVEL_APP:INFO}
logging.level.org.hibernate.SQL=${LOG_LEVEL_SQL:WARN}
logging.level.org.springframework.web=INFO

# ---------------------------------------------------------------------------
# Graceful shutdown so in-flight requests finish during a rolling deploy.
# ---------------------------------------------------------------------------
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=25s
