# Production overrides. Active when SPRING_PROFILES_ACTIVE=prod (set by the Docker image).
#
# Everything here is a hardening delta over application.properties. Datasource and
# secrets are NOT defaulted anywhere — the container must inject DATABASE_URL,
# DATABASE_USERNAME, DATABASE_PASSWORD and JWT_ACCESS_SECRET or startup fails.

# ---------------------------------------------------------------------------
# Flyway — production schema only. db/dev (V6 seed users with the shared
# password Password123!, V7 seed tutor) must never run here.
# ---------------------------------------------------------------------------
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
# Fail rather than silently re-checksumming a tampered migration.
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true

# ---------------------------------------------------------------------------
# Error responses — no internals to unauthenticated callers.
# ---------------------------------------------------------------------------
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false

# Behind an ingress / load balancer, so X-Forwarded-* are trusted by default here.
# Set TRUST_FORWARD_HEADERS=false if the app is exposed directly to the internet.
app.security.trust-forward-headers=${TRUST_FORWARD_HEADERS:true}

# Admin self-registration stays bootstrap-only unless deliberately re-enabled.
app.security.admin-self-register-enabled=${ADMIN_SELF_REGISTER:false}

# ---------------------------------------------------------------------------
# API docs — off by default in prod; flip SWAGGER_ENABLED=true to expose them.
# ---------------------------------------------------------------------------
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}

# ---------------------------------------------------------------------------
# Actuator — health/info/prometheus only, and health details never anonymous.
# ---------------------------------------------------------------------------
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true
management.info.env.enabled=false

# The mail indicator authenticates against SMTP on EVERY health probe. With mail
# disabled (or credentials unset) it reports DOWN, which drags /actuator/health to
# HTTP 503 — so the container never becomes healthy and orchestrators refuse to
# route to it. Only consider mail when mail is actually turned on.
management.health.mail.enabled=${MAIL_ENABLED:false}

# Readiness = "can this instance serve requests", which means the database and
# nothing else. Third-party outages must not eject a working instance from the
# load balancer; they belong on dashboards, not in the probe.
management.endpoint.health.group.readiness.include=readinessState,db
management.endpoint.health.group.liveness.include=livenessState

# ---------------------------------------------------------------------------
# Logging — INFO app, no SQL. LOG_LEVEL_* still override per-deployment.
# ---------------------------------------------------------------------------
logging.level.root=INFO
logging.level.com.eduplatform=${LOG_LEVEL_APP:INFO}
logging.level.org.hibernate.SQL=${LOG_LEVEL_SQL:WARN}
logging.level.org.springframework.web=INFO

# ---------------------------------------------------------------------------
# Graceful shutdown so in-flight requests finish during a rolling deploy.
# ---------------------------------------------------------------------------
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=25s
