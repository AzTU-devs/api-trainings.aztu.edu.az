spring.application.name=eduplatform-backend
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Optional local overrides for `./mvnw spring-boot:run` — put DATABASE_URL, secrets, etc.
# in a gitignored .env at the repo root. Absent in containers, where real env vars are injected.
spring.config.import=optional:file:.env[.properties]

# ---------------------------------------------------------------------------
# Datasource (Postgres)
# ---------------------------------------------------------------------------
# No defaults on purpose: an unset DATABASE_* in prod must fail loudly at startup
# rather than silently connecting somewhere unintended. The dev profile supplies
# localhost fallbacks (application-dev.properties).
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:20}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN:5}
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.max-lifetime=1800000

# ---------------------------------------------------------------------------
# JPA / Hibernate
# ---------------------------------------------------------------------------
spring.jpa.open-in-view=false
# Flyway owns the schema; Hibernate must not second-guess PG-specific types
# (citext, inet, jsonb, bpchar) that its validator misreports as mismatches.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.format_sql=false

# ---------------------------------------------------------------------------
# Flyway
# ---------------------------------------------------------------------------
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
# Production schema only. Dev seed migrations (V6/V7) live in classpath:db/dev and are
# added to the locations by the dev profile (application-dev.properties) — they MUST NOT
# ship to production. ignore-migration-patterns tolerates DBs where they were already applied.
spring.flyway.locations=classpath:db/migration
spring.flyway.ignore-migration-patterns=*:missing
spring.flyway.schemas=public

# ---------------------------------------------------------------------------
# Mail
# ---------------------------------------------------------------------------
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# When false (default) OTP/verification emails are logged instead of sent —
# set MAIL_ENABLED=true once SMTP credentials are configured.
app.mail.enabled=${MAIL_ENABLED:false}
app.mail.from=${MAIL_FROM:no-reply@eduplatform.local}

# ---------------------------------------------------------------------------
# Servlet / Server
# ---------------------------------------------------------------------------
# Sized for the largest MULTIPART upload, which is a 25 MB PDF — deliberately NOT for the
# 512 MB video ceiling.
#
# Tomcat spools a multipart part to java.io.tmpdir in full BEFORE any controller or
# validator sees it, so this figure is the real amount of disk an authenticated caller can
# make the server write per request. The per-kind ceilings in MediaService
# (app.uploads.max-*-mb) can only reject the file afterwards. Setting this to 512 MB would
# therefore hand every self-registered student a 512 MB disk-write primitive on
# POST /api/media, on an endpoint with no rate limit in front of it.
#
# Video does not need it: the admin uploads video through the raw streaming
# PUT /api/videos/{id}/content, which these limits do not govern and which is capped while
# the bytes arrive. /api/media is the only multipart endpoint, and it takes images and PDFs.
#
# 32 MB leaves headroom over the 25 MB document ceiling for the multipart envelope.
# The admin portal's nginx `client_max_body_size` (550m) sits above both, since it must
# also pass the streaming video PUT.
spring.servlet.multipart.max-file-size=32MB
spring.servlet.multipart.max-request-size=40MB

server.port=${SERVER_PORT:8080}
server.forward-headers-strategy=framework
server.error.include-message=always
server.error.include-binding-errors=always

# ---------------------------------------------------------------------------
# Actuator
# ---------------------------------------------------------------------------
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=when-authorized
# Liveness/readiness probes in every profile, not just prod: they are off by default
# outside Kubernetes, and the image HEALTHCHECK and both compose stacks poll
# /actuator/health/readiness — which 404s, i.e. reports the container unhealthy forever,
# when this is false.
management.endpoint.health.probes.enabled=true
management.metrics.tags.application=${spring.application.name}

# ---------------------------------------------------------------------------
# OpenAPI / Swagger
# ---------------------------------------------------------------------------
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha
# Show every endpoint in a single Swagger document, grouped by @Tag annotations on controllers.
springdoc.paths-to-match=/api/**,/actuator/health

# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------
logging.level.root=INFO
logging.level.com.eduplatform=${LOG_LEVEL_APP:DEBUG}
logging.level.org.hibernate.SQL=${LOG_LEVEL_SQL:WARN}
logging.level.org.springframework.security=INFO

# ---------------------------------------------------------------------------
# Application
# ---------------------------------------------------------------------------
app.base-url=${APP_BASE_URL:http://localhost:8080}
app.frontend.public-url=${FRONTEND_PUBLIC_URL:http://localhost:3000}
app.frontend.portal-url=${FRONTEND_PORTAL_URL:http://localhost:3001}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001,http://localhost:5173,http://localhost:5174}

# Security / JWT
app.security.jwt.issuer=${JWT_ISSUER:eduplatform}
# No default: StartupSecurityValidator also rejects weak/placeholder values outside dev.
app.security.jwt.access-secret=${JWT_ACCESS_SECRET}
app.security.jwt.access-ttl-minutes=${JWT_ACCESS_TTL_MIN:15}
app.security.jwt.refresh-ttl-days=${JWT_REFRESH_TTL_DAYS:30}
app.security.bcrypt-strength=12
# Secure flag on the admin portal's refresh-token cookie. auto = set on every profile
# except dev, which is the only place the browser genuinely speaks plain HTTP (and Safari
# discards Secure cookies on http://localhost, which would break local sign-in).
# true/false force it; any other value fails fast at startup.
app.security.cookies.secure=${COOKIE_SECURE:auto}
# Account auto-locks after this many consecutive failed logins (unlock via super-admin security view).
app.security.max-failed-logins=${MAX_FAILED_LOGINS:5}
# Trust X-Forwarded-For / X-Real-IP only when behind a trusted reverse proxy that sets them
# (otherwise clients can spoof their source IP, defeating the IP blocklist + audit attribution).
app.security.trust-forward-headers=${TRUST_FORWARD_HEADERS:false}
# Admin self-registration is bootstrap-only: allowed only until the first ADMIN/SUPER_ADMIN exists,
# unless explicitly re-enabled here.
app.security.admin-self-register-enabled=${ADMIN_SELF_REGISTER:false}

# Housekeeping: cron for purging expired OTPs / OAuth states / stale refresh tokens (hourly by default).
app.cleanup.cron=${CLEANUP_CRON:0 0 * * * *}
# API request logs older than this many days are purged by the cleanup job.
app.cleanup.api-log-retention-days=${API_LOG_RETENTION_DAYS:30}

# OAuth
app.oauth.google.client-id=${OAUTH_GOOGLE_CLIENT_ID:}
app.oauth.google.client-secret=${OAUTH_GOOGLE_CLIENT_SECRET:}
app.oauth.google.redirect-uri=${app.base-url}/api/auth/oauth/google/callback

app.oauth.facebook.app-id=${OAUTH_FACEBOOK_APP_ID:}
app.oauth.facebook.app-secret=${OAUTH_FACEBOOK_APP_SECRET:}
app.oauth.facebook.redirect-uri=${app.base-url}/api/auth/oauth/facebook/callback

app.oauth.apple.team-id=${APPLE_TEAM_ID:}
app.oauth.apple.services-id=${APPLE_SERVICES_ID:}
app.oauth.apple.key-id=${APPLE_KEY_ID:}
app.oauth.apple.private-key=${APPLE_PRIVATE_KEY_PEM:}
app.oauth.apple.redirect-uri=${app.base-url}/api/auth/oauth/apple/callback

# Storage
# LOCAL is the only provider with an implementation (LocalStorageService); the S3_* keys
# below are placeholders for a future backend and setting STORAGE_PROVIDER=S3 today
# changes nothing. See DEPLOY.md.
app.storage.provider=${STORAGE_PROVIDER:LOCAL}
app.storage.s3.bucket=${S3_BUCKET:}
app.storage.s3.region=${S3_REGION:}
app.storage.s3.access-key=${S3_ACCESS_KEY:}
app.storage.s3.secret-key=${S3_SECRET_KEY:}
# Where uploaded media is written. Must be the container path that the host volume is
# mounted on (Dockerfile VOLUME + docker-compose mounts both use /opt/uploads) — point
# it anywhere unmounted and every upload is silently lost on the next redeploy. The dev
# profile overrides this with a repo-local path that needs no root to create.
app.storage.local.base-dir=${STORAGE_LOCAL_DIR:/opt/uploads}

# Per-kind upload ceilings, enforced server-side in the media/video services.
#
# max-image-mb and max-document-mb travel over multipart /api/media, so raising either past
# spring.servlet.multipart.max-file-size (32MB) makes the servlet reject the file before the
# typed per-kind error can be produced — raise both together.
#
# max-video-mb is different: video goes over the streaming PUT /api/videos/{id}/content,
# which multipart limits do not govern, so it is bounded only by this value and by nginx's
# `client_max_body_size` (550m on the admin portal). Keep nginx above it, or the proxy
# answers 413 with no typed error body for the uploader to show.
app.uploads.max-image-mb=${UPLOAD_MAX_IMAGE_MB:10}
app.uploads.max-video-mb=${UPLOAD_MAX_VIDEO_MB:512}
app.uploads.max-document-mb=${UPLOAD_MAX_DOCUMENT_MB:25}

# Payments. No payment provider is integrated, so this stays false: order creation is
# refused with a typed error and the public catalogue serves FREE courses only, which is
# what keeps a learner from reaching a checkout that cannot charge them. Flipping it to
# true without wiring a provider first exposes exactly that dead end.
app.payments.enabled=${PAYMENTS_ENABLED:false}

# Per-IP token buckets in front of the unauthenticated auth endpoints. Turning this off
# leaves login, OTP and password-reset open to credential stuffing and OTP brute force —
# only do it for a load test, and never on an internet-facing deployment.
app.ratelimit.enabled=${RATE_LIMIT_ENABLED:true}
