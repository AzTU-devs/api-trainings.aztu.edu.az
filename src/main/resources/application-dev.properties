# Dev-only overrides. Active when SPRING_PROFILES_ACTIVE=dev (the default).
# Includes the dev seed migrations (V6 dev users, V7 seed tutor profile) which must
# NEVER be applied to a production database.
spring.flyway.locations=classpath:db/migration,classpath:db/dev

# Local fallbacks so `./mvnw spring-boot:run` works with no setup beyond a running
# Postgres (docker compose up postgres). Point elsewhere by exporting DATABASE_* or
# adding them to a gitignored .env — never by hardcoding a real DSN here.
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/eduplatform}
spring.datasource.username=${DATABASE_USERNAME:eduplatform}
spring.datasource.password=${DATABASE_PASSWORD:eduplatform}

# Dev-only signing key. Rejected outside the dev profile by StartupSecurityValidator.
app.security.jwt.access-secret=${JWT_ACCESS_SECRET:dev-only-insecure-signing-key-not-for-any-deployed-environment}

# /opt/uploads (the production default) is a container path that needs root to create on
# a developer machine, so local runs write into the gitignored var/ directory instead.
# STORAGE_LOCAL_DIR still wins if it is set.
app.storage.local.base-dir=${STORAGE_LOCAL_DIR:./var/uploads}
