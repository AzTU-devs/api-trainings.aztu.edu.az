# Read by the docker-java client that Testcontainers shades.
#
# Testcontainers 1.20.x (the version the pom's BOM pins) asks the Docker daemon for API 1.32
# unless a version is configured here, and Docker Engine 29 refuses anything that old, so every
# container start failed with "client version 1.32 is too old". 1.44 is Docker 25's API: new
# enough for Engine 29, and served by any daemon a CI runner or developer machine still has.
# Remove this file once the pom's Testcontainers version handles Docker 29 on its own.
api.version=1.44
